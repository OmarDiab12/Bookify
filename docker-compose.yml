version: '3.9'

services:

  bookify.api:
    image: bookifyapi
    container_name: bookify-api

    build:
      context: .
      dockerfile: Bookify.Api/Dockerfile

    ports:
      - "5000:80"

    depends_on:
      - bookify-idp

  bookify-idp:
    image: quay.io/keycloak/keycloak:24.0
    container_name: bookify-idp

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    command: start-dev

    ports:
      - "8080:8080"

  bookify-seq:
    image: datalust/seq:2024.3

    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: Admin123!

    ports:
      - "8081:80"

  bookify-redis:
    image: redis:lastest
    container_name: bookify.redis
    restart: always
    ports:
      - '6379:6379'
  