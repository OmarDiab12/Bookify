version: '3.9'

services:

  bookify.api:
    image: bookifyapi
    container_name: bookify-api

    build:
      context: .
      dockerfile: Bookify.Api/Dockerfile

    ports:
      - "5000:80"

    depends_on:
      - bookify-idp

  bookify-idp:
    image: quay.io/keycloak/keycloak:24.0
    container_name: bookify-idp

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    command: start-dev

    ports:
      - "8080:8080"